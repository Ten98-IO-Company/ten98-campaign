services:
  campaign:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:3018:3018"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3018
      DATA_DIR: /app/data
    volumes:
      - campaign-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3018/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  campaign-data:
